[project]
name = "finguard-backend"
version = "3.0.0"
description = "Finguard 3.0 — Unified Python Backend"
requires-python = "==3.12.*"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "motor>=3.5.0",          # async MongoDB
    # Cache & messaging
    "redis[hiredis]>=5.0.0",
    "aio-pika>=9.4.0",
    # Auth & security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # Transactional email (Gmail SMTP) + templating + PDF invoices
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    "weasyprint>=62",
    # Background tasks
    "celery[redis]>=5.4.0",
    # ML / anomaly detection + forecasting
    "scikit-learn>=1.5.0",
    "rapidfuzz>=3.0.0",
    "statsmodels>=0.14.0",
    "pgvector>=0.3.0",
    # AI / LLM & orchestration
    "openai>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "numpy>=2.0.0",
    # Validation & settings
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Observability
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.4.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Utilities
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.5.0",
    # SQL AST validation (Text-to-SQL guardrail)
    "sqlglot>=25.0.0",
    # Report generation (Agent G exports)
    "reportlab>=4.2.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-passlib",
    "types-python-jose",
    "types-redis",
    # Celery Flower monitoring UI — used by the celery-flower worker container.
    "flower>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test files routinely contain long mock-target paths
# (patch("a.b.c.d.e.f", new_callable=AsyncMock, ...)) and inline fixture data
# where wrapping to 100 cols hurts readability more than it helps. E501 stays
# strictly enforced in src/ where line length aids production readability.
"tests/**/*.py" = ["E501"]
# Prompt modules are natural-language catalogs/few-shot examples (often verbatim
# JSON), where wrapping to 100 cols would corrupt the illustrative payloads the
# LLM is shown. Line length is not a readability aid for prose prompts.
"src/domains/intelligence/prompts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
namespace_packages = true

# Allow untyped calls during transition
allow_untyped_calls = true
allow_untyped_defs = false
allow_incomplete_defs = false
warn_return_any = false

# Third-party libraries that ship no type stubs / py.typed marker. Treat their
# imports as untyped rather than erroring — we don't control their packaging.
[[tool.mypy.overrides]]
module = [
    "statsmodels.*",
    "reportlab.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm_judge: LLM-as-judge evals — skipped unless RUN_LLM_EVALS=1 (nightly; costs tokens, needs FIREWORKS_API_KEY)",
]
filterwarnings = [
    "error",
    # passlib imports the deprecated `crypt` stdlib module at the module level;
    # the library is unmaintained and has no fix for Python 3.12+.
    "ignore::DeprecationWarning:passlib",
    # pytest-asyncio runs each test in its own event loop, so async resources
    # (asyncpg connections, sockets, selector transports) that are GC'd after
    # their loop has closed emit teardown warnings — "coroutine 'Connection._cancel'
    # was never awaited", "Exception ignored in <socket.socket ...:5432>",
    # "_SelectorTransport.__del__", etc. pytest surfaces these as unraisable-
    # exception warnings, which `error` was escalating into spurious, flaky
    # (GC-timing dependent) cross-domain failures. They are benign test-teardown
    # noise, never product issues, so ignore the whole class.
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # joblib reconstructs pickled sklearn arrays (Agent E IsolationForest) by
    # assigning to ndarray.shape, which NumPy 2.5 deprecated. The warning is raised
    # from within joblib's unpickler on a dependency we don't control; message-match
    # (not module) so it's caught regardless of the emitting frame. Remove when
    # joblib ships a NumPy-2.5-clean release.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py"]
