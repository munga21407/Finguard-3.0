<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject | default("Finguard") }}</title>
  </head>
  <body style="margin:0; padding:0; background:#f4f4f7; font-family:Arial,Helvetica,sans-serif; color:#1f2933;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05);">
            <tr>
              <td style="background:#6b38d4; padding:20px 28px;">
                <span style="color:#ffffff; font-size:18px; font-weight:bold; letter-spacing:-0.01em;">Finguard</span>
              </td>
            </tr>
            <tr>
              <td style="padding:28px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:18px 28px; background:#fafafa; border-top:1px solid #ececf1; color:#8a94a6; font-size:12px;">
                {% block footer %}You received this message from Finguard.{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
