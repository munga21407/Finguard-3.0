events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # Per-IP rate-limit buckets. `auth` is tight (login/token brute-force);
    # `api` is a generous ceiling for general API traffic.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Cap request bodies so a huge upload can't exhaust memory/disk.
    client_max_body_size 10m;

    # Trusted-edge client IP. This nginx terminates client connections directly,
    # so $remote_addr IS the real client. The API locations below SET (not append)
    # X-Forwarded-For to $remote_addr, discarding any client-supplied value — the
    # backend reads the left-most XFF entry for the per-IP login lockout and the
    # M-Pesa callback IP allowlist, so an appendable (spoofable) header would let
    # a client forge its source IP and defeat both controls. If you ever place a
    # CDN / load-balancer in front of this nginx, switch to the realip module
    # (set_real_ip_from <trusted-range>; real_ip_header X-Forwarded-For;) instead.

    server {
        listen 80;
        server_name _;

        # Security headers (applied to every response, including proxied ones).
        # NOTE: TLS/HSTS is terminated at the edge in production — add
        # `Strict-Transport-Security` once HTTPS is enabled (Sprint 4).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Tight rate limit on auth endpoints (login / token refresh) — defence
        # in depth alongside the application-level per-account lockout.
        location ~ ^/api/v1/identity/(token|register) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;  # SET, not append (spoof-proof)
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            # No trailing slash on the upstream: the backend mounts its routers
            # under /api/v1/... so the full request URI must be preserved.
            # `proxy_pass http://backend/;` (with a slash) would rewrite
            # /api/v1/finance -> /v1/finance and 404 every API call.
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;  # SET, not append (spoof-proof)
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
