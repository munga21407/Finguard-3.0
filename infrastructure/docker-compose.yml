# ──────────────────────────────────────────────────────────────────────────────
# FinGuard 3.0 — Docker Compose
#
# Usage
# ─────
#   Core only (API + infra):
#     docker compose up
#
#   Core + background workers (Celery worker, Beat, Flower):
#     docker compose --profile workers up
#
#   Core + full observability stack (Prometheus, Grafana, Redis Exporter):
#     docker compose --profile monitoring up
#
#   Everything:
#     docker compose --profile workers --profile monitoring up
#
# Profiles
# ────────
#   workers     celery-worker · celery-beat · flower
#   monitoring  prometheus · grafana · redis-exporter
# ──────────────────────────────────────────────────────────────────────────────

# ── Reusable YAML anchors ─────────────────────────────────────────────────────

# Shared environment for every backend process: API server and all workers.
# Using x-backend-env so both `backend` and worker services can merge it.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finguard}:${POSTGRES_PASSWORD:-finguard}@postgres:5432/${POSTGRES_DB:-finguard}
  MONGODB_URL: mongodb://${MONGO_USER:-finguard}:${MONGO_PASSWORD:-finguard}@mongodb:27017
  MONGO_URI: mongodb://${MONGO_USER:-finguard}:${MONGO_PASSWORD:-finguard}@mongodb:27017
  REDIS_URL: redis://:${REDIS_PASSWORD:-finguard}@redis:6379/0
  AUTH_REDIS_URL: redis://:${REDIS_PASSWORD:-finguard}@redis:6379/1
  RATE_LIMIT_REDIS_URL: redis://:${REDIS_PASSWORD:-finguard}@redis:6379/2
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-finguard}:${RABBITMQ_PASSWORD:-finguard}@rabbitmq:5672/
  SECRET_KEY: ${SECRET_KEY}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  # Celery-specific overrides — explicit so the app never falls back to REDIS_URL.
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-finguard}:${RABBITMQ_PASSWORD:-finguard}@rabbitmq:5672/
  CELERY_REDIS_URL: redis://:${REDIS_PASSWORD:-finguard}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-finguard}@redis:6379/0
  # Transactional email. The celery-worker runs the outbox flush, so it needs
  # these as much as the backend does. MAIL_ENABLED defaults to false (dry run).
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  MAIL_ENABLED: ${MAIL_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Finguard}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
  # Feature flags — off by default everywhere (matches config.py), overridable
  # per environment via a .env file next to this compose file. See
  # docs/A2A_PLANNER_STAGING_BAKE.md / docs/TASK_VC_STAGING_BAKE.md.
  A2A_PLANNER_ENABLED: ${A2A_PLANNER_ENABLED:-false}
  TASK_VC_ENFORCEMENT_ENABLED: ${TASK_VC_ENFORCEMENT_ENABLED:-false}
  LANGGRAPH_CHECKPOINTING_ENABLED: ${LANGGRAPH_CHECKPOINTING_ENABLED:-false}
  CSRF_ENABLED: ${CSRF_ENABLED:-true}

# depends_on block reused by celery-worker (needs the schema migrated + DB and
# both brokers healthy).
x-worker-depends: &worker-depends
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

# Build config for the backend dev image (all extras including flower).
# Workers mount the source tree so code changes are reflected without rebuild.
x-worker-build: &worker-build
  context: ../backend
  target: dev

# ── Services ──────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  # NOTE: datastores are NOT published to the host in this (production-shaped)
  # base file — services reach them over the internal Docker network only.
  # docker-compose.dev.yml re-exposes them for local tooling.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard}
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-finguard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-finguard}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-finguard}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-finguard} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-finguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-finguard}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Schema migration (one-shot) ─────────────────────────────────────────────
  # Runs `alembic upgrade head` to completion, then exits. The backend and
  # workers gate on its success (service_completed_successfully), so no process
  # ever serves traffic against an un-migrated schema. This is the topology-level
  # enforcement of the migrations-on-deploy contract (init_db never create_all's).
  migrate:
    build: ../backend
    command: uv run alembic -c alembic/alembic.ini upgrade head
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - "no-new-privileges:true"

  # ── Application ─────────────────────────────────────────────────────────────

  backend:
    build: ../backend
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Not published to the host — external traffic must enter through nginx
    # (TLS) only. docker-compose.dev.yml exposes 8000 directly for local work.
    expose:
      - "8000"
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  frontend:
    build: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

  # ── Observability (profile: monitoring) ─────────────────────────────────────
  # Start with: docker compose --profile monitoring up

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      # Primary config — sourced from monitoring/ at the repo root.
      # Scrape jobs: finguard-backend · flower-celery · redis-exporter
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"   # enables /-/reload via POST /-/reload

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Default home dashboard — points to the D3 AI overview.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /monitoring/dashboards/finguard_ai_overview.json
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      # Dashboard provider config: tells Grafana to load JSON files from /monitoring/dashboards
      - ../monitoring/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      # Dashboard JSON files (finguard_ai_overview.json + any others placed here)
      - ../monitoring/dashboards:/monitoring/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"    # host 3001 avoids collision with frontend on 3000
    depends_on:
      - prometheus

  # Redis Exporter — translates Redis INFO stats to Prometheus /metrics.
  # Prometheus scrapes it at redis-exporter:9121 (see prometheus/prometheus.yml).
  redis-exporter:
    image: oliver006/redis_exporter:latest
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-finguard}
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  # ── Workers (profile: workers) ───────────────────────────────────────────────
  # Start with: docker compose --profile workers up
  #
  # All three services:
  #   • build from the `dev` Dockerfile target so flower + all extras are present
  #   • bind-mount ../backend:/app for live code reloading without a rebuild
  #   • use an anonymous /app/.venv volume to preserve the uv-managed virtualenv
  #     that was installed during `docker build` (prevents the bind mount from
  #     shadowing the container's site-packages)

  celery-worker:
    build: *worker-build
    # -c 2  : two child processes (scale out via replicas, not concurrency)
    # -Q    : subscribe to every queue wired in celery_app.task_routes — a queue
    #         missing here means Beat keeps publishing tasks nothing ever consumes
    #         (notifications carries email.* : outbox flush + payment reminders).
    command: uv run celery -A src.workers.tasks worker -l info -c 2 -Q ocr_processing,batch_processing,watchdog,notifications
    profiles: ["workers"]
    security_opt:
      - "no-new-privileges:true"
    environment:
      <<: *backend-env
      ENABLE_EXPENSE_EVENT_CONSUMER: "true"
      ENABLE_OUTBOX_PROJECTOR: "true"
    depends_on: *worker-depends
    volumes:
      - ../backend:/app
      - /app/.venv    # preserve the container's uv virtualenv

  celery-beat:
    build: *worker-build
    # PersistentScheduler writes last-run timestamps to a file; the named
    # volume keeps them across container recreations.
    command: uv run celery -A src.workers.tasks beat -l info --scheduler=celery.beat.PersistentScheduler --schedule=/app/celerybeat-data/celerybeat-schedule
    profiles: ["workers"]
    security_opt:
      - "no-new-privileges:true"
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - /app/.venv                              # preserve the container's uv virtualenv
      - celerybeat_schedule:/app/celerybeat-data  # persist beat schedule across restarts

  flower:
    build: *worker-build
    # Flower is installed via the `flower` dev-extra in pyproject.toml.
    # --port is explicit so the mapping below is self-documenting.
    command: uv run celery -A src.workers.tasks flower --port=5555
    profiles: ["workers"]
    security_opt:
      - "no-new-privileges:true"
    environment:
      <<: *backend-env
    ports:
      - "5555:5555"    # Flower web UI
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - /app/.venv    # preserve the container's uv virtualenv

# ── Volumes ───────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  celerybeat_schedule:    # Persists Beat's last-run schedule across restarts
