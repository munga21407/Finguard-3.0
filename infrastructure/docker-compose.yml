services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard}
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-finguard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-finguard}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-finguard}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-finguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-finguard}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finguard}:${POSTGRES_PASSWORD:-finguard}@postgres:5432/${POSTGRES_DB:-finguard}
      MONGODB_URL: mongodb://${MONGO_USER:-finguard}:${MONGO_PASSWORD:-finguard}@mongodb:27017
      REDIS_URL: redis://:${REDIS_PASSWORD:-finguard}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-finguard}:${RABBITMQ_PASSWORD:-finguard}@rabbitmq:5672/
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    ports:
      - "8000:8000"

  celery_worker:
    build: ../backend
    command: uv run celery -A src.workers.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finguard}:${POSTGRES_PASSWORD:-finguard}@postgres:5432/${POSTGRES_DB:-finguard}
      REDIS_URL: redis://:${REDIS_PASSWORD:-finguard}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-finguard}:${RABBITMQ_PASSWORD:-finguard}@rabbitmq:5672/
    depends_on:
      - backend

  frontend:
    build: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
