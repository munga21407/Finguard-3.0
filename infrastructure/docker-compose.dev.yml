services:
  # Run migrations under the dev image + dev config so local `compose up` doesn't
  # trip the production config validation (which requires METRICS_AUTH_SECRET, a
  # strong SECRET_KEY, etc.). Migrations themselves are environment-agnostic.
  migrate:
    build:
      context: ../backend
      target: dev
    environment:
      ENVIRONMENT: development

  postgres:
    # Provision the finguard_readonly role on first init so dev exercises the
    # same read-only Text-to-SQL boundary as production (gap #2b dev parity).
    environment:
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-finguard_readonly}
    volumes:
      - ./scripts/init-readonly-role.sh:/docker-entrypoint-initdb.d/10-readonly-role.sh:ro
    ports:
      - "5432:5432"

  mongodb:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build:
      context: ../backend
      target: dev
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    # Expose directly to the host for local debugging (the base file only routes
    # through nginx). Dev runs without the prod config validation.
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      # Point Agent D/E Text-to-SQL at the read-only role provisioned above, so
      # the privilege boundary is real in dev (not just the string-level guard).
      DATABASE_READONLY_URL: postgresql+asyncpg://finguard_readonly:${POSTGRES_READONLY_PASSWORD:-finguard_readonly}@postgres:5432/${POSTGRES_DB:-finguard}

  frontend:
    build:
      context: ../frontend
      target: dev
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
