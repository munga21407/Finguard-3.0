services:
  postgres:
    ports:
      - "5432:5432"

  mongodb:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build:
      context: ../backend
      target: dev
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
    environment:
      ENVIRONMENT: development
      DEBUG: "true"

  frontend:
    build:
      context: ../frontend
      target: dev
    command: npm run dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
