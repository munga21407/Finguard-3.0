global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI backend — exposes /metrics via prometheus-fastapi-instrumentator.
  # Includes all finguard_* custom metrics and the D3 canonical
  # agent_llm_processing_seconds / outbox_sync_latency_seconds series.
  - job_name: "finguard-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  # Celery Flower — exposes worker task state and throughput metrics.
  # Only reachable when the `workers` profile is active; Prometheus marks
  # the target DOWN otherwise (expected, not an error).
  - job_name: "flower-celery"
    static_configs:
      - targets: ["flower:5555"]
    metrics_path: /metrics

  # Redis Exporter — translates Redis INFO stats into Prometheus metrics.
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
